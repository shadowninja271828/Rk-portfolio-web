<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="x-apple-disable-message-reformatting">
    <title>Welcome to RK Editing</title>
  </head>
  <body style="margin:0; padding:0; background-color:#0a0a0a; color:#e5e5e5; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width:100%; border-collapse:collapse; background-color:#0a0a0a;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width:100%; max-width:560px; border-collapse:separate; border-spacing:0; background-color:#111111; border:1px solid #252525; border-radius:18px;">
            <tr>
              <td style="padding:36px 32px 12px; color:#00ffff; font-family:Arial, Helvetica, sans-serif; font-size:12px; font-weight:bold; letter-spacing:4px; line-height:18px;">
                RK EDITING
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 0; color:#ffffff; font-family:Arial, Helvetica, sans-serif; font-size:32px; font-weight:bold; line-height:38px;">
                Welcome to RK Editing
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 0; color:#b8b8b8; font-family:Arial, Helvetica, sans-serif; font-size:16px; line-height:26px;">
                Thank you for creating an account. Please verify your email address to complete your registration, connect with me, and explore the full portfolio.
              </td>
            </tr>
            <tr>
              <td align="left" style="padding:30px 32px 36px;">
                <table role="presentation" border="0" cellspacing="0" cellpadding="0" style="border-collapse:separate;">
                  <tr>
                    <td align="center" bgcolor="#00ffff" style="border-radius:999px; background-color:#00ffff;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:16px 28px; border:1px solid #00ffff; border-radius:999px; color:#000000; font-family:Arial, Helvetica, sans-serif; font-size:13px; font-weight:bold; letter-spacing:1px; line-height:18px; text-align:center; text-decoration:none;">
                        VERIFY EMAIL
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="width:100%; max-width:560px; border-collapse:collapse;">
            <tr>
              <td align="center" style="padding:20px 16px 0; color:#666666; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:18px;">
                If you did not create this account, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
